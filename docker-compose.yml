version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: segmentation-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-segmentation}
      MYSQL_USER: ${DB_USER:-apiuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-apipassword}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USER:-apiuser}", "-p${DB_PASSWORD:-apipassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - segmentation-network

  redis:
    image: redis:7-alpine
    container_name: segmentation-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - segmentation-network

  api:
    build: .
    container_name: item-segmentation-api
    ports:
      - "8000:8000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-apiuser}
      - DB_PASSWORD=${DB_PASSWORD:-apipassword}
      - DB_NAME=${DB_NAME:-segmentation}
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENABLE_LEARNING=${ENABLE_LEARNING:-true}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - segmentation-network

  celery_dictionary_worker:
    build: .
    container_name: celery-dictionary-worker
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=10 -Q dictionary
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-apiuser}
      - DB_PASSWORD=${DB_PASSWORD:-apipassword}
      - DB_NAME=${DB_NAME:-segmentation}
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - segmentation-network

  celery_llm_worker:
    build: .
    container_name: celery-llm-worker
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2 -Q llm,batch
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-apiuser}
      - DB_PASSWORD=${DB_PASSWORD:-apipassword}
      - DB_NAME=${DB_NAME:-segmentation}
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - segmentation-network

volumes:
  mysql_data:

networks:
  segmentation-network:
    driver: bridge
